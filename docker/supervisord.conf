[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/data
user=postgres
priority=10
autorestart=true
stopsignal=TERM

[program:redis]
command=/usr/bin/redis-server --appendonly yes --dir /data
user=redis
priority=20
autorestart=true
stopsignal=TERM

[program:prometheus]
command=/usr/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/var/lib/prometheus
priority=30
autorestart=true
stopsignal=TERM

[program:grafana]
command=/usr/sbin/grafana server --homepath=/usr/share/grafana --config=/etc/grafana/grafana.ini
user=grafana
priority=40
autorestart=true
stopsignal=TERM

[program:payment-gateway]
command=/usr/bin/java -XX:MaxRAMPercentage=75.0 -jar /app/app.jar
user=app
priority=50
autorestart=true
stopsignal=TERM
